name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1))
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlashlight-APK
          path: '**/*.apk'
